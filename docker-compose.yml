services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend/ai-learning-assistant
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
